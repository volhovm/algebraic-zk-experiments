[package]
name = "sp1-schnorr-script"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "sp1_schnorr_script"
path = "src/lib.rs"

[[bin]]
name = "sp1-schnorr-script"
path = "src/main.rs"

[dependencies]
sp1-sdk = { workspace = true }
sp1-schnorr-lib = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"

# For host-side MSM verification using arkworks (re-exported through zkbrownian)
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false, features = ["curve"] }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false }
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
ark-ed-on-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false }
rand = "0.8"
merlin = "2"

# For generating test data
zkbrownian = { path = "../.." }

[build-dependencies]
sp1-build = { workspace = true }
